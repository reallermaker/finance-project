[project]
name = "cross-asset-regime-graph"
version = "0.1.0"
description = "Infer multi-asset regimes from lead-lag and correlation graph structure."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "reallermaker"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "networkx>=3.0",
  "scikit-learn>=1.3",
]

[project.scripts]
cross_asset_regime_graph = "cross_asset_regime_graph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
